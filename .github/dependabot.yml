version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Compose/lifecycle lines newer than these need JVM 11 bytecode; keep them on their branches.
    ignore:
      - dependency-name: "org.jetbrains.compose.runtime:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.androidx.lifecycle:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib*"
      # GTNHGradle 2.0.29 loses the Minecraft jar from the compile classpath on Gradle 9.6+.
      - dependency-name: "gradle-wrapper"
        versions: [">= 9.6"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
