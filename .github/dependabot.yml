version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Compose/lifecycle lines newer than these need JVM 11 bytecode; keep them on their branches.
    ignore:
      - dependency-name: "org.jetbrains.compose.runtime:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.androidx.lifecycle:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib*"
      # Coroutines come from Forgelin at runtime; compiling against a newer API would crash in game.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
