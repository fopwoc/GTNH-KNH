name: Build jars

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-jars-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all jars
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version without a prefix: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Build all jars
        env:
          BUILD_JOBS: "2"
        run: JAVA25_HOME="$JAVA_HOME" bash ./build.sh

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: gtnh-kotlin-jars-${{ github.sha }}
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  release:
    name: Publish release jars
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          name: gtnh-kotlin-jars-${{ github.sha }}
          path: artifacts

      - name: Generate commit changelog
        run: |
          previous_tag="$(git describe --tags --match '*.*.*' --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$GITHUB_REF_NAME" --pretty=format:'- %s (`%h`)'
              echo
              echo
              echo "**Full diff:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_REF_NAME"
            else
              git log "$GITHUB_REF_NAME" --pretty=format:'- %s (`%h`)'
              echo
            fi
          } > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" artifacts/*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.jar \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
