name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      security-events: write

  # Temporary: finds the HUD layer ids to draw below the F3 debug screen.
  probe:
    name: Probe HUD layer APIs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: Fabric_26_2
      - run: ./gradlew :framework:buildFabric_26_2 :framework:buildNeoforge_26_2 :framework:buildFabric_1_21_1 :framework:buildNeoforge_1_21_1 --no-daemon -q || true
      - name: Print signatures
        run: |
          for v in 26.2 26.1.2; do
            MC=$(find ~/.gradle/caches/fabric-loom -name "minecraft-merged-deobf-$v.jar" | head -1)
            echo "===== $v"
            for c in net.minecraft.client.renderer.GameRenderer net.minecraft.client.Minecraft net.minecraft.client.gui.Gui; do
              echo "--- $c"
              javap -c -p -cp "$MC" "$c" | grep -nE '^  [a-z].*\(|Gui\.extract[A-Za-z]*|DebugScreenOverlay\.extractRenderState|Screen\.extractRenderStateWithTooltipAndSubtitles|GuiRenderer\.render' | grep -B1 -E 'Gui\.extract|DebugScreenOverlay\.extract|Screen\.extract|GuiRenderer\.render' | head -40 || true
            done
          done
