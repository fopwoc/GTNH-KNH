name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      security-events: write

  # Temporary: finds the HUD layer ids to draw below the F3 debug screen.
  probe:
    name: Probe HUD layer APIs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: Fabric_26_2
      - run: ./gradlew :framework:buildFabric_26_2 :framework:buildNeoforge_26_2 :framework:buildFabric_1_21_1 :framework:buildNeoforge_1_21_1 --no-daemon -q || true
      - name: Print signatures
        run: |
          for j in $(find ~/.gradle/caches . -name '*.jar' 2>/dev/null | grep -iE 'fabric-rendering-v1|fabric-api-[0-9]' | sort -u | head -8); do
            echo "===== $j"
            for c in $(unzip -l "$j" | grep -oE 'net/fabricmc/fabric/api/client/rendering/v1/(hud/)?(VanillaHudElements|HudElementRegistry|HudLayerRegistrationCallback|IdentifiedLayer|LayeredDrawerWrapper)\.class' | sed 's/\.class//; s#/#.#g'); do
              echo "--- $c"; javap -public -cp "$j" "$c" | grep -iE 'debug|attach|add|class|interface' | head -12 || true
            done
          done
          for j in $(find ~/.gradle/caches . -name '*.jar' 2>/dev/null | grep -iE 'neoforge' | sort -u); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/neoforged/neoforge/client/gui/VanillaGuiLayers.class'; then
              echo "===== $j"
              javap -public -cp "$j" net.neoforged.neoforge.client.gui.VanillaGuiLayers | grep -iE 'debug|chat|tab' || true
              javap -public -cp "$j" net.neoforged.neoforge.client.event.RegisterGuiLayersEvent | grep -iE 'register' || true
            fi
          done | head -60
          for v in 26.2 26.1.2; do
            MC=$(find ~/.gradle/caches/fabric-loom -name "minecraft-merged-deobf-$v.jar" | head -1)
            echo "===== $v $MC"
            javap -public -cp "$MC" net.minecraft.client.gui.components.DebugScreenOverlay | grep -iE 'show|render|extract' || true
          done
