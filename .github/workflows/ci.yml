name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      security-events: write

  # Temporary: prints 1.21.1 dependency versions this session cannot resolve locally.
  probe:
    name: Probe 1.21.1 versions
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          meta() { echo "== $1"; curl -fsSL "$1" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -E "$2" | tail -n "${3:-8}"; }
          meta https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml '^21\.1\.'
          meta https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml '\+1\.21\.1$'
          meta https://maven.fabricmc.net/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/maven-metadata.xml '.' 12
          meta https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/maven-metadata.xml '.' 6
          meta https://thedarkcolour.github.io/KotlinForForge/thedarkcolour/kotlinforforge-neoforge/maven-metadata.xml '^5\.' 12
          meta https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml '.' 4
          for v in $(curl -fsSL https://thedarkcolour.github.io/KotlinForForge/thedarkcolour/kotlinforforge-neoforge/maven-metadata.xml | grep -o '<version>5[^<]*</version>' | sed 's/<[^>]*>//g' | tail -n 3); do
            echo "== KFF $v pom deps"; curl -fsSL "https://thedarkcolour.github.io/KotlinForForge/thedarkcolour/kotlinforforge-neoforge/$v/kotlinforforge-neoforge-$v.pom" | grep -A2 '<artifactId>kotlin-stdlib' | head -3
            curl -fsSL "https://thedarkcolour.github.io/KotlinForForge/thedarkcolour/kotlinforforge-neoforge/$v/kotlinforforge-neoforge-$v.jar" -o kff.jar && unzip -p kff.jar META-INF/neoforge.mods.toml | grep -A3 -E 'modId *= *"(neoforge|minecraft)"' | grep -E 'modId|versionRange'
          done
