name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      security-events: write

  # Temporary: finds the HUD layer ids to draw below the F3 debug screen.
  probe:
    name: Probe HUD layer APIs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: Fabric_26_2
      - run: ./gradlew :framework:buildFabric_26_2 :framework:buildNeoforge_26_2 :framework:buildFabric_1_21_1 :framework:buildNeoforge_1_21_1 --no-daemon -q || true
      - name: Print signatures
        run: |
          for v in 26.2 26.1.2; do
            MC=$(find ~/.gradle/caches/fabric-loom -name "minecraft-merged-deobf-$v.jar" | head -1)
            echo "===== $v"
            javap -c -p -cp "$MC" net.minecraft.client.gui.Gui | grep -nE '^  [a-z].*\(|DebugScreenOverlay\.|invokevirtual.*Gui\.extract|invokespecial.*Gui\.extract|invokedynamic' | head -120 || true
          done
          J=$(find ~/.gradle/caches -name 'fabric-rendering-v1-23*.jar' | grep -v sources | head -1)
          unzip -o -q "$J" -d /tmp/fr
          ls /tmp/fr/*.mixins.json; cat /tmp/fr/*.mixins.json
          for c in $(find /tmp/fr -path '*mixin*' -name '*Gui*.class' -o -path '*mixin*' -name '*Hud*.class' | head -5); do echo "--- $c"; javap -v "$c" | grep -iE 'target|method|at=|Lnet/minecraft/client/gui' | head -30; done
