name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      security-events: write

  # Temporary: lists Fabric's vanilla HUD element ids and where addLast lands.
  probe:
    name: Probe Fabric HUD elements
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: Fabric_26_2
      - run: ./gradlew :framework:buildFabric_26_2 --no-daemon -q || true
      - name: Print signatures
        run: |
          for J in $(find ~/.gradle/caches -name 'fabric-rendering-v1-*.jar' | grep -v sources | sort -u); do
            echo "===== $J"
            javap -p -cp "$J" net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements 2>/dev/null | grep 'static' || true
            javap -c -p -cp "$J" net.fabricmc.fabric.impl.client.rendering.hud.HudElementRegistryImpl 2>/dev/null | grep -E 'addLast|addFirst|VanillaHudElements\.|getstatic' | head -30 || true
          done
