name: CI

on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - "**/*.md"
      - ".github/assets/**"
      - "AI_USAGE.md"
      - "COPYRIGHT"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      security-events: write

  # Temporary: prints the Minecraft 1.21.1 APIs the port needs; this session cannot resolve them.
  probe:
    name: Probe 1.21.1 APIs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: Fabric_1_21_1
      - run: ./gradlew :framework:buildFabric_1_21_1 :framework:buildNeoforge_1_21_1 --no-daemon -q
      - name: Print signatures
        run: |
          jar_with() { find "$@" -name '*.jar' ! -name '*sources*' 2>/dev/null | while read -r j; do unzip -l "$j" 2>/dev/null | grep -q " $CLASS\$" && { echo "$j"; break; }; done; }
          CLASS=net/minecraft/client/gui/GuiGraphics.class; MC=$(jar_with ~/.gradle/caches/fabric-loom framework/.knhmp/fabric-1_21_1)
          CLASS=net/neoforged/neoforge/client/event/RegisterGuiLayersEvent.class; NEO=$(jar_with framework/.knhmp/neoforge ~/.gradle/caches)
          FAPI=$(find framework/.knhmp/fabric-1_21_1 ~/.gradle/caches/fabric-loom -path '*remapped*' -name '*.jar' 2>/dev/null | tr '\n' ':')
          echo "MC=$MC"; echo "NEO=$NEO"; CP="$MC:$NEO:$FAPI"
          for c in com.mojang.blaze3d.vertex.Tesselator com.mojang.blaze3d.vertex.BufferBuilder com.mojang.blaze3d.vertex.BufferUploader \
                   com.mojang.blaze3d.vertex.DefaultVertexFormat 'com.mojang.blaze3d.vertex.VertexFormat$Mode' com.mojang.blaze3d.vertex.VertexConsumer \
                   com.mojang.blaze3d.vertex.PoseStack 'com.mojang.blaze3d.vertex.PoseStack$Pose' net.minecraft.client.renderer.GameRenderer \
                   net.minecraft.client.Camera 'net.minecraft.client.renderer.MultiBufferSource$BufferSource' 'net.minecraft.client.gui.Font$DisplayMode' \
                   net.minecraft.client.renderer.RenderStateShard net.minecraft.client.KeyboardHandler net.minecraft.client.MouseHandler \
                   net.minecraft.client.Gui net.minecraft.world.level.ClipContext net.minecraft.world.level.chunk.status.ChunkStatus \
                   net.minecraft.client.resources.model.BakedModel net.minecraft.client.renderer.block.model.BakedQuad \
                   net.minecraft.client.renderer.block.BlockModelShaper net.minecraft.client.resources.model.ModelManager \
                   net.minecraft.client.color.block.BlockColors net.minecraft.client.color.block.BlockColor \
                   net.minecraft.client.renderer.texture.TextureAtlasSprite net.minecraft.client.renderer.texture.SpriteContents \
                   net.minecraft.world.level.chunk.LevelChunk net.minecraft.world.level.chunk.ChunkAccess net.minecraft.world.level.LevelHeightAccessor \
                   net.minecraft.world.level.chunk.LevelChunkSection net.minecraft.core.Holder 'net.minecraft.core.HolderLookup$RegistryLookup' \
                   net.minecraft.core.RegistryAccess net.minecraft.world.level.biome.Biome net.minecraft.client.multiplayer.ClientLevel \
                   net.minecraft.client.multiplayer.ClientChunkCache net.minecraft.client.renderer.block.LiquidBlockRenderer \
                   net.minecraft.client.renderer.block.BlockRenderDispatcher net.minecraft.world.level.material.FluidState \
                   net.minecraft.client.renderer.LevelRenderer net.minecraft.util.RandomSource \
                   net.fabricmc.fabric.api.client.render.fluid.v1.FluidRenderHandlerRegistry net.fabricmc.fabric.api.client.render.fluid.v1.FluidRenderHandler \
                   net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents net.fabricmc.fabric.api.client.rendering.v1.WorldRenderContext \
                   net.neoforged.neoforge.client.extensions.common.IClientFluidTypeExtensions net.neoforged.neoforge.client.event.RenderLevelStageEvent \
                   'net.neoforged.neoforge.client.event.InputEvent$Key' 'net.neoforged.neoforge.client.event.InputEvent$MouseButton$Pre' \
                   'net.neoforged.neoforge.client.event.InputEvent$MouseScrollingEvent' 'net.neoforged.neoforge.client.event.ScreenEvent$Opening' \
                   net.neoforged.neoforge.client.model.data.ModelData; do
            echo "== $c"; javap -public -cp "$CP" "$c" 2>&1 | grep -v '^Compiled from' || true
          done
          echo "== protected RenderStateShard / RenderType"; javap -protected -cp "$CP" net.minecraft.client.renderer.RenderStateShard net.minecraft.client.renderer.RenderType | grep -E 'static|create' || true
          echo "== Minecraft members"; javap -public -cp "$CP" net.minecraft.client.Minecraft | grep -E 'pauseGame|levelRenderer|gameRenderer|getModelManager|getBlockColors|getBlockRenderer|getResourceManager|gui |font|level |getTextureAtlas' || true
          echo "== Options members"; javap -public -cp "$CP" net.minecraft.client.Options | grep -E 'hideGui|keyPlayerList' || true
