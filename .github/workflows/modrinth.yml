name: Modrinth

# Publishes a GitHub release to Modrinth: KNH Core, then the mods against it, for every loader and
# Minecraft version. Jars and changelog come from the release, so a tag can be (re)published by hand;
# versions already on Modrinth are skipped. Projects, dependencies and IDs: .github/modrinth/.
# Off while MODRINTH_TOKEN is unset.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
    secrets:
      MODRINTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modrinth-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Modrinth
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check Modrinth credentials
        id: credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [[ -z "$MODRINTH_TOKEN" ]]; then
            echo "Modrinth token is absent; upload is not enabled yet."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Download release
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --pattern '*.jar' --dir "$RUNNER_TEMP/jars"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/changelog.md"

      - name: Publish
        if: steps.credentials.outputs.enabled == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: .github/modrinth/publish.sh "$TAG" "$RUNNER_TEMP/jars" "$RUNNER_TEMP/changelog.md"
