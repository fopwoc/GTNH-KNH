name: Maven repository

# Rebuilds the whole Maven repository from the development-jar bundles attached to every GitHub
# release and deploys it to GitHub Pages. Called after each release; run it by hand to rebuild,
# e.g. after deleting a release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the Maven repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup
        with:
          cache: checks

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble the repository from release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew mavenSite --no-daemon

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/maven-site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
