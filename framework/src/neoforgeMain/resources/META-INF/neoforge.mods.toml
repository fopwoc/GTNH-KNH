modLoader = "kotlinforforge"
loaderVersion = "[6,)"
license = "WTFNMFPL"
issueTrackerURL = "${issuesUrl}"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
authors = "fopwoc"
description = "Kotlin New Horizons — a Jetpack Compose runtime for Minecraft mods. And more."
displayURL = "${repositoryUrl}"

[[dependencies.${modId}]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
side = "BOTH"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
side = "BOTH"
