# Detekt (an embedded Kotlin compiler) and ktfmt run inside the root daemon; the 512 MiB default runs out.
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build
# Reuses task outputs across checkouts and CI jobs, e.g. KnhMP itself, compiled by every build.
org.gradle.caching = true
org.gradle.configuration-cache = false
org.gradle.parallel = false
kotlin.mpp.applyDefaultHierarchyTemplate = false
kotlin.suppressGradlePluginWarnings = KotlinSourceSetTreeDependsOnMismatch
