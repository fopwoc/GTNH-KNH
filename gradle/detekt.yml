naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  ComplexCondition:
    allowedConditions: 5
  CyclomaticComplexMethod:
    allowedComplexity: 25
  LargeClass:
    excludes: ['**/src/test/**']
  LongMethod:
    allowedLines: 150
    excludes: ['**/src/test/**']
  NestedBlockDepth:
    allowedDepth: 5
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 25
    allowedFunctionsPerInterface: 30
    allowedFunctionsPerObject: 30

style:
  # Pixel colors, GL constants, binary layouts, and test fixtures are clearer as literals.
  MagicNumber:
    active: false
  LoopWithTooManyJumpStatements:
    maxJumpCount: 2
  MaxLineLength:
    active: false
  ReturnCount:
    max: 5
    excludeGuardClauses: true
  ThrowsCount:
    max: 4
    excludeGuardClauses: true
