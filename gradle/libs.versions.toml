[versions]
jvmBytecode = "24"
kotlin = "2.4.20"
serialization = "1.11.0"
compose = "1.12.1"
lifecycle = "2.11.0"
navigation3 = "1.1.7"

# Formatting and analysis, applied repo-wide by the KnhMP quality plugin
spotless = "8.10.2"
ktfmt = "0.64"
palantirJavaFormat = "2.99.0"
# The 2.0 line is K2-based and the one that parses Kotlin 2.4; the Compose rules build against it.
detekt = "2.0.0-alpha.6"
composeRules = "0.6.7"

# GTNH 1.7.10
gtnhGradle = "2.0.31"
forgelin = "2.0.3-GTNH"
# Forgelin 2.0.3-GTNH embeds this stdlib at runtime; GTNH code must not depend on newer stdlib API.
gtnhKotlinStdlib = "2.1.10"
# Opis (with MobiusCore) as shipped by GTNH 2.9.0-beta-3; Hotspot reads its profiler on the server.
opis = "1.4.12-mapless"

# Minecraft 26.2
minecraft = "26.2"
loom = "1.18.2"
fabricLoader = "0.19.5"
fabricApi = "0.161.0+26.2"
fabricLanguageKotlin = "1.14.1+kotlin.2.4.20"
fabricKotlinStdlib = "2.4.20"
moddev = "2.0.147"
neoforge = "26.2.0.88"
kotlinForForge = "6.3.0"
forgeConfigApiPort = "26.2.1"
clothConfig = "26.2.155"
modMenu = "20.0.2"
neoforgeKotlinStdlib = "2.4.0"

[libraries]
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }
forgelin = { module = "com.github.GTNewHorizons:Forgelin", version.ref = "forgelin" }
opis = { module = "com.github.GTNewHorizons:Opis", version.ref = "opis" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabricApi" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabricLanguageKotlin" }
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }
forgeconfigapiport-fabric = { module = "fuzs.forgeconfigapiport:forgeconfigapiport-fabric", version.ref = "forgeConfigApiPort" }
cloth-config-fabric = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "clothConfig" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modMenu" }
kotlinforforge-neoforge = { module = "thedarkcolour:kotlinforforge-neoforge", version.ref = "kotlinForForge" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-runtime-saveable = { module = "androidx.compose.runtime:runtime-saveable", version.ref = "compose" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
gtnh-convention = { id = "com.gtnewhorizons.gtnhconvention", version.ref = "gtnhGradle" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
