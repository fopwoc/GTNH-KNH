[versions]
java = "25"
jvmBytecode = "8"
kotlin = "2.2.21"
forgelin = "2.0.3-GTNH"
serialization = "1.11.0"
# Compose and Lifecycle releases after these versions require JVM 11 bytecode.
compose = "1.6.11"
# Forgelin 2.0.3-GTNH embeds this version for GTNH 2.9.0-beta-2.
coroutines = "1.10.1"
lifecycle = "2.8.4"

[libraries]
forgelin = { module = "com.github.GTNewHorizons:Forgelin", version.ref = "forgelin" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-runtime-saveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "compose" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
gtnh-convention = { id = "com.gtnewhorizons.gtnhconvention" }
buildconfig = { id = "com.github.gmazzo.buildconfig" }
