modLoader = "kotlinforforge"
loaderVersion = "[5,)"
license = "WTFNMFPL"
issueTrackerURL = "${issuesUrl}"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
authors = "fopwoc"
description = "A measuring tape: lines, boxes and spheres drawn in the world with their sizes, kept per world and exportable."
displayURL = "${repositoryUrl}"

[[dependencies.${modId}]]
modId = "knhcore"
type = "required"
versionRange = "[${modVersion}]"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
side = "CLIENT"
