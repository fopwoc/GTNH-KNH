modLoader = "kotlinforforge"
loaderVersion = "[6,)"
license = "WTFNMFPL"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
authors = "fopwoc"
description = "Storybook for KNH Core: every framework component in its states, one screen. Development tool, not for packs."

[[dependencies.${modId}]]
modId = "knhcore"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
side = "CLIENT"
