modLoader = "kotlinforforge"
loaderVersion = "[6,)"
license = "WTFNMFPL"
issueTrackerURL = "${issuesUrl}"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
authors = "fopwoc"
description = "Storybook for KNH Core: every component in its states on one screen. A development tool."
displayURL = "${repositoryUrl}"

[[dependencies.${modId}]]
modId = "knhcore"
type = "required"
versionRange = "[${modVersion}]"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
side = "CLIENT"
